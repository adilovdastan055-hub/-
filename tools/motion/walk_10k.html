<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
/* Сплит-экран «эксперт + инфографика» (сцены — прогулка 10 000 шагов): сверху сцены с графикой на градиенте,
   снизу — окно (дыра в фоне), сквозь которое видно видео спикера; между ними строка субтитров. */
:root { --accent: #3EE6B0; --font: 'Inter'; }
#wrap { animation: none; }
#bg { position: absolute; inset: 0; }
.bgl { position: absolute; inset: 0; opacity: 0; }
.card { position: absolute; border-radius: var(--r); border: calc(var(--u) * .3) solid rgba(255,255,255,.14);
        box-shadow: 0 0 calc(var(--u) * 6) rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.04); }
.scene { position: absolute; left: 0; right: 0; top: 0; height: 58%; display: flex; flex-direction: column;
         align-items: center; text-align: center; opacity: 0; padding-top: 15%; }
.small { font-family: var(--font); font-weight: 700; font-size: calc(var(--u) * 5.2); line-height: 1.15; color: #fff;
         letter-spacing: -.01em; padding: 0 8%; }
.big { font-family: var(--font); font-weight: 900; font-size: calc(var(--u) * 11.5); line-height: 1.02; color: #fff;
       letter-spacing: -.035em; margin-top: calc(var(--u) * 1); padding: 0 5%; position: relative; }
.big .acc, .small .acc { color: var(--accent); }
.big.ul::after { content: ''; position: absolute; left: 8%; right: 8%; bottom: -.04em; height: .07em; border-radius: .05em;
                 background: #FF7A2F; transform-origin: left; animation: inherit; }
.light .small, .light .big { color: #121514; }
.mid { zoom: 1.35; margin-top: calc(var(--u) * 5); position: relative; display: flex; justify-content: center; align-items: center; gap: calc(var(--u) * 2.4); }
.glass { background: linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.04)); border: 1px solid rgba(255,255,255,.14);
         border-radius: calc(var(--u) * 3); box-shadow: 0 calc(var(--u) * 2) calc(var(--u) * 5) rgba(0,0,0,.35);
         backdrop-filter: blur(6px); }
.label { font-family: var(--font); font-weight: 700; color: #fff; font-size: calc(var(--u) * 3.6); }
.dim { font-family: var(--font); color: rgba(255,255,255,.6); font-weight: 600; font-size: calc(var(--u) * 3.8); }
.pill { font-family: var(--font); font-weight: 800; font-size: calc(var(--u) * 3.6); color: #0B1A15; background: var(--accent);
        border-radius: 999px; padding: .45em 1.1em; box-shadow: 0 0 calc(var(--u) * 4) rgba(62,230,176,.45); display: inline-flex; gap: .4em; align-items: center; }
svg { overflow: visible; }

@keyframes up { from { opacity: 0; transform: translateY(35%); filter: blur(8px); } to { opacity: 1; transform: none; filter: none; } }
@keyframes pop { 0% { opacity: 0; transform: scale(.4); } 65% { opacity: 1; transform: scale(1.08); } 100% { opacity: 1; transform: scale(1); } }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
@keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes spin { to { transform: rotate(360deg); } }

#cap { position: absolute; left: 50%; transform: translate(-50%, -50%); white-space: nowrap; font-family: var(--font);
       font-weight: 700; font-size: calc(var(--u) * 3.3); color: #fff; padding: .42em .9em; border-radius: .6em;
       background: rgba(10,14,13,.55); border: 1px solid rgba(255,255,255,.10); }
#cap span { color: rgba(255,255,255,.45); margin: 0 .13em; position: relative; }
#cap span.on { color: #fff; }
#cap span.cur { color: #fff; }
#cap span.cur::after { content: ''; position: absolute; left: 0; right: 0; bottom: -.12em; height: .12em; border-radius: .1em; background: #FF7A2F; }
</style></head><body><div id="bg"></div><div id="wrap"></div><div id="cap"></div><script src="_base.js"></script><script>
// params: words — [[слово, start, end], …]; card — [x, y, w] в долях кадра (окно с видео до низа кадра)
const S = [];            // сцены: {el, a, b}
const BG = [];           // фоны: {el, a}
let WORDS = [], GROUPS = [], CNT = [];
const $ = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls;
  if (html != null) e.innerHTML = html; parent.appendChild(e); return e; };
const A = (e, name, t, dur = .55, ease = 'cubic-bezier(.2,.9,.25,1.05)') => {
  e.style.animation = `${name} ${dur}s ${ease} ${t}s both`; return e; };
const BGS = {
  dark:   'radial-gradient(120% 60% at 15% 0%, #3B2416 0%, rgba(59,36,22,0) 60%), radial-gradient(110% 55% at 70% 55%, #0E4A3A 0%, rgba(14,74,58,0) 70%), #0A0F0E',
  green:  'radial-gradient(120% 70% at 50% 35%, #0F5A45 0%, #0A2E25 55%, #07150F 100%)',
  light:  'radial-gradient(90% 50% at 85% 20%, #BFF5E2 0%, rgba(191,245,226,0) 70%), linear-gradient(180deg, #F4F6F5, #E9EEEC)',
  orange: 'radial-gradient(120% 60% at 50% 15%, #7A3510 0%, #3A1A0A 55%, #120A06 100%)',
  night:  'radial-gradient(100% 60% at 50% 30%, #13312A 0%, #0A1311 60%, #060908 100%)',
  teal:   'radial-gradient(120% 70% at 50% 25%, #12806A 0%, #0B3D33 55%, #061712 100%)',
};
function bg(kind, a) { const e = $('div', 'bgl', document.getElementById('bg')); e.style.background = BGS[kind];
  A(e, 'fadein', a, .45, 'ease'); BG.push(e); }
function scene(a, b, kind, small, big, opts = {}) {
  bg(kind, a);
  const s = $('div', 'scene' + (kind === 'light' ? ' light' : ''), document.getElementById('wrap'));
  S.push({ el: s, a, b });
  if (small) A($('div', 'small', s, small), 'up', a + .05);
  if (big) { const g = A($('div', 'big' + (opts.ul ? ' ul' : ''), s, big), 'up', opts.bigAt ?? a + .15, .6); }
  return $('div', 'mid', s);
}
const ICON = {
  globe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>',
  leaf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19c0-8 5-13 14-14-1 9-6 14-14 14z"/><path d="M5 19l7-7"/></svg>',
  wave: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 9c3-3 6 3 9 0s6 3 9 0M3 15c3-3 6 3 9 0s6 3 9 0"/></svg>',
  yin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 3a4.5 4.5 0 0 1 0 9a4.5 4.5 0 0 0 0 9" /><circle cx="12" cy="7.5" r="1" fill="currentColor"/><circle cx="12" cy="16.5" r="1"/></svg>',
  eye: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  inf: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 12c-2-2.6-3.6-4-5.5-4a4 4 0 0 0 0 8c1.9 0 3.5-1.4 5.5-4zm0 0c2 2.6 3.6 4 5.5 4a4 4 0 0 0 0-8c-1.9 0-3.5 1.4-5.5 4z"/></svg>',
};
const ic = (name, size, color = '#fff') => `<span style="display:inline-flex;width:${size}px;height:${size}px;color:${color}">${ICON[name]}</span>`;
Object.assign(ICON, {
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H5M11 6l-6 6 6 6"/></svg>',
  foot: '<svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="8" cy="7.5" rx="3" ry="4.5"/><ellipse cx="16" cy="12.5" rx="3" ry="4.5"/><ellipse cx="8" cy="15" rx="2.2" ry="1.4"/><ellipse cx="16" cy="20" rx="2.2" ry="1.4"/></svg>',
  flag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg>',
  road: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3L4 21M16 3l4 18M12 4v3M12 10.5v3M12 17v3"/></svg>',
});

window.setup = () => {
  css('--u', U + 'px');
  const [cx, cy, cw] = P.card || [.09, .62, .82];
  const R = W * .05; css('--r', R + 'px');
  const X = cx * W, Y = cy * H, CW = cw * W, CH = H - Y + R * 2;
  // дыра в фоне под видео (скругление сверху; низ уходит за кадр)
  const hole = `M${X + R} ${Y} H${X + CW - R} A${R} ${R} 0 0 1 ${X + CW} ${Y + R} V${Y + CH} H${X} V${Y + R} A${R} ${R} 0 0 1 ${X + R} ${Y} Z`;
  document.getElementById('bg').style.clipPath = `path(evenodd, "M0 0 H${W} V${H} H0 Z ${hole}")`;
  const card = $('div', 'card', document.getElementById('wrap'));
  Object.assign(card.style, { left: X + 'px', top: Y + 'px', width: CW + 'px', height: CH + 'px' });
  const cap = document.getElementById('cap'); cap.style.top = (Y - U * 5.2) + 'px';

  // субтитры: фразы по знакам препинания, не длиннее 5 слов
  WORDS = (P.words || []).map(([w, s, e]) => ({ w, s, e }));
  let g = [];
  WORDS.forEach((w, i) => { g.push(i); if (/[.,!?]$/.test(w.w) || g.length >= 5) { GROUPS.push(g); g = []; } });
  if (g.length) GROUPS.push(g);

  const u = U;
  const num = v => Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
  const row = (m, w) => { const c = $('div', 'glass', m);
    Object.assign(c.style, { width: w * u + 'px', padding: `${2.6 * u}px ${3.4 * u}px`, display: 'flex', gap: 2.6 * u + 'px', alignItems: 'center' });
    return c; };
  const badge = (name, col = '#3EE6B0') => `<div style="width:${10 * u}px;height:${10 * u}px;border-radius:${2.6 * u}px;background:rgba(62,230,176,.14);display:flex;align-items:center;justify-content:center;flex:none">${ic(name, 6 * u, col)}</div>`;

  // 1. «Так, вот дошёл до площади Батыр қыздар»
  let m = scene(0, 4.55, 'dark', 'Дошёл до площади', 'Батыр <span class="acc">қыздар</span>', { bigAt: 2.5, ul: true });
  let c = A(row(m, 62), 'pop', .9, .6);
  c.innerHTML = `${badge('pin', '#FF7A2F')}<div style="flex:1;text-align:left;white-space:nowrap"><div class="label">финиш маршрута</div>
    <div class="dim" style="font-size:${3.2 * u}px">площадь · памятник</div></div>
    <div class="pill" style="font-size:${3.2 * u}px">${ic('check', 3.6 * u, '#0B1A15')}дошёл</div>`;
  A(c.querySelector('.pill'), 'pop', 3.0, .5);

  // 2. «От стелы до сюда это 4 808 шагов, почти 5 000» — маршрут + счётчик
  m = scene(4.55, 12.3, 'night', 'От стелы до сюда', '', {});
  const RW = 60 * u, RH = 20 * u; const rt = $('div', '', m); Object.assign(rt.style, { width: RW + 'px', height: RH + 'px', position: 'relative' });
  const rp = `M8 60 C 60 10, 110 90, 160 45 S 250 20, 292 40`;
  rt.innerHTML = `<svg viewBox="0 0 300 80" width="100%" height="100%"><path d="${rp}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="5" stroke-dasharray="2 9" stroke-linecap="round"/>
    <path d="${rp}" fill="none" stroke="url(#rg)" stroke-width="5" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" style="animation:draw 5.4s cubic-bezier(.4,0,.3,1) 5.4s forwards"/>
    <defs><linearGradient id="rg"><stop offset="0" stop-color="#FF7A2F"/><stop offset="1" stop-color="#3EE6B0"/></linearGradient></defs>
    <circle cx="8" cy="60" r="7" fill="#FF7A2F"/><circle cx="292" cy="40" r="7" fill="#3EE6B0"/></svg>`;
  [['стела', 0, .86, 5.2], ['Батыр қыздар', 1, -.08, 10.4]].forEach(([t, right, top, at]) => {
    const l = A($('div', 'label', rt, t), 'up', at, .5);
    Object.assign(l.style, { position: 'absolute', top: top * RH + 'px', [right ? 'right' : 'left']: 0, fontSize: 3.3 * u + 'px', color: right ? '#3EE6B0' : '#FFB27A' });
  });
  const big2 = A($('div', 'big', m.parentElement), 'up', 9.5, .6);
  big2.style.marginTop = 4 * u + 'px';
  big2.innerHTML = `<span class="cnt">0</span> <span style="font-size:.42em;letter-spacing:0">шагов</span>`;
  CNT.push({ el: big2.querySelector('.cnt'), a: 5.3, b: 10.9, from: 0, to: 4808, fmt: num });
  const near = A($('div', 'pill', m.parentElement, `почти 5 000`), 'pop', 11.36, .5);
  near.style.marginTop = 2.4 * u + 'px';

  // 3. «Получается, прямо от стелы … Назарбаева … практически 5 000, и обратно — 10 000»
  m = scene(12.3, 22.36, 'green', 'от стелы по проспекту', 'Назарбаева', { bigAt: 15.2, ul: true });
  m.style.flexDirection = 'column'; m.style.gap = 2 * u + 'px'; m.style.zoom = 1.2;
  [['arrow', 'туда', '≈ 5 000', 19.85], ['back', 'обратно', '≈ 5 000', 20.8]].forEach(([ico, t, v, at], i) => {
    const k = A(row(m, 60), 'pop', at, .5);
    k.innerHTML = `${badge(ico)}<div class="label" style="flex:1;text-align:left">${t}</div><div class="label" style="color:#3EE6B0">${v}</div>`;
  });
  const tot = A($('div', 'pill', m, `= 10 000 шагов`), 'pop', 21.8, .55);
  tot.style.fontSize = 4.4 * u + 'px'; tot.style.marginTop = 1 * u + 'px';

  // 4. «Говорят же, норма — проходить 10 000»
  m = scene(22.36, 24.95, 'orange', 'Говорят же, норма —', '10 000', { bigAt: 23.9 });
  const RR = 15 * u; const ring = $('div', '', m); Object.assign(ring.style, { width: RR * 2 + 'px', height: RR * 2 + 'px', position: 'relative' });
  ring.innerHTML = `<svg viewBox="0 0 100 100" width="100%" height="100%" style="transform:rotate(-90deg)"><circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="9"/>
    <circle cx="50" cy="50" r="42" fill="none" stroke="#FF7A2F" stroke-width="9" stroke-linecap="round" pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" style="animation:draw 1.5s cubic-bezier(.4,0,.2,1) 22.6s forwards;filter:drop-shadow(0 0 6px #FF7A2F)"/></svg>`;
  const fi = $('div', '', ring, ic('foot', 11 * u, '#fff')); Object.assign(fi.style, { position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center' });
  A(fi, 'pop', 22.5, .5);
  A($('div', 'dim', m.parentElement, 'шагов в день'), 'up', 24.2).style.marginTop = 2.4 * u + 'px';

  // 5. «Имейте в виду: стела, до конца по проспекту Назарбаева, до площади Батыр қыздар и обратно»
  m = scene(24.95, 34.2, 'dark', 'Имейте в виду', '<span class="acc">маршрут</span>', { bigAt: 25.05 });
  m.style.flexDirection = 'column'; m.style.gap = 1.4 * u + 'px'; m.style.zoom = 1; m.style.marginTop = 3 * u + 'px';
  [['flag', 'старт — стела', 25.9, 28.75], ['road', 'по проспекту Назарбаева', 28.75, 29.85], ['pin', 'до площади Батыр қыздар', 29.85, 32.4], ['back', 'и обратно', 32.4, 34.2]].forEach(([ico, t, a, b], i) => {
    const k = A(row(m, 80), 'pop', a, .45); k.style.padding = `${1.8 * u}px ${3 * u}px`;
    k.innerHTML = `<div class="label" style="width:${5 * u}px;color:#3EE6B0;font-size:${4 * u}px">${i + 1}</div>${badge(ico)}<div class="label" style="flex:1;text-align:left;white-space:nowrap;font-size:${4 * u}px">${t}</div>`;
    CNT.push({ el: k, a, b, hl: true });
  });

  // 6. «Вот вам 10 000»
  m = scene(34.2, 99, 'teal', 'Вот вам', '', {});
  const fin = A($('div', 'big', m.parentElement), 'up', 34.85, .6);
  fin.innerHTML = `<span class="cnt" style="color:#B8FFE6">0</span>`; fin.style.fontSize = 17 * u + 'px';
  CNT.push({ el: fin.querySelector('.cnt'), a: 34.9, b: 35.9, from: 0, to: 10000, fmt: num });
  const done = A($('div', 'pill', m.parentElement, ic('check', 4 * u, '#0B1A15') + 'шагов за одну прогулку'), 'pop', 35.5, .5);
  done.style.marginTop = 3 * u + 'px'; done.style.fontSize = 4 * u + 'px';
  window.seek(0);
};


const clamp = x => Math.max(0, Math.min(1, x));
window.seek = t => {
  // сцены: появление 0.3 с, уход 0.2 с
  S.forEach(({ el, a, b }) => {
    const k = clamp((t - a) / .3) * (1 - clamp((t - (b - .2)) / .2));
    el.style.opacity = k; el.style.transform = `translateY(${(1 - clamp((t - a) / .3)) * 3}%) scale(${1 - (1 - clamp((t - (b - .2)) / .2)) * 0 + (clamp((t - (b - .2)) / .2)) * -.04})`;
    el.style.visibility = k > 0 ? 'visible' : 'hidden';
  });
  CNT.forEach(c => {
    const k = clamp((t - c.a) / (c.b - c.a)), e = ease.outCubic(k);
    if (c.text != null) { const n = Math.round(c.text.length * k); c.el.innerHTML = c.text.slice(0, n) + `<span style="opacity:${Math.floor(t * 3) % 2 ? 1 : .2};color:#3EE6B0">|</span>`; }
    else if (c.hl) { const on = t >= c.a && t < c.b; c.el.style.borderColor = on ? '#3EE6B0' : 'rgba(255,255,255,.14)';
      c.el.style.boxShadow = on ? '0 0 30px rgba(62,230,176,.45)' : '0 20px 50px rgba(0,0,0,.35)'; c.el.style.opacity = t < c.a ? '' : (on ? 1 : .55); if (t >= c.a) c.el.style.transform = on ? 'scale(1.06)' : 'scale(.96)'; }
    else if (c.merge) { const d = (1 - ease.outCubic(k)) * U * 16; c.merge[0].style.transform = `translateX(${-d}px)`; c.merge[1].style.transform = `translateX(${d}px) scale(${1 + k * .15})`; }
    else if (c.dot) { const kk = clamp((t - c.a) / 1.3); c.dot.style.offsetDistance = (ease.outCubic(kk) * 100 + Math.max(0, t - c.a - 1.3) * 40) % 100 + '%'; c.dot.style.opacity = t > c.a ? 1 : 0; }
    else if (c.rings) { c.rings.forEach((r, i) => { let p = ((t - c.a) * .55 + i / c.rings.length) % 1; if (t < c.a) p = i / c.rings.length;
        const s = c.out ? .15 + p * 1.6 : 1.75 - p * 1.6; r.style.transform = `scale(${s})`; r.style.opacity = (c.out ? 1 - p : p) * .9; }); }
    else if (c.fmt) { const v = c.from + (c.to - c.from) * e; if (c.html) c.el.innerHTML = c.fmt(v); else c.el.textContent = c.fmt(v); }
  });
  // субтитры
  const cap = document.getElementById('cap');
  let gi = -1;
  GROUPS.forEach((g, i) => { if (t >= WORDS[g[0]].s - .05) gi = i; });
  if (gi < 0) { cap.style.opacity = 0; return; }
  const g = GROUPS[gi], last = WORDS[g[g.length - 1]];
  const nextStart = GROUPS[gi + 1] ? WORDS[GROUPS[gi + 1][0]].s : 1e9;
  cap.style.opacity = (t > last.e + .6 && t < nextStart - .05) ? 0 : 1;
  cap.innerHTML = g.map(i => { const w = WORDS[i]; const cls = t >= w.s && t < w.e + .08 ? 'cur' : (t >= w.s ? 'on' : '');
    return `<span class="${cls}">${w.w.replace(/[.,]$/, '')}</span>`; }).join('');
};
</script></body></html>
