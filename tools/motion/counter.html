<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
.c { position: absolute; left: 0; right: 0; top: var(--y); transform: translateY(-50%); text-align: center; }
.in { display: inline-block; animation: popIn .5s cubic-bezier(.2,.9,.3,1.3) both; }
.num { font-family: var(--font); font-weight: 900; font-size: var(--size); color: var(--accent); line-height: 1;
       font-variant-numeric: tabular-nums; text-shadow: 0 .04em .15em rgba(0,0,0,.4); white-space: nowrap; }
.lbl { font-family: 'Montserrat'; font-weight: 700; font-size: calc(var(--size) * .26); color: var(--color);
       text-transform: uppercase; letter-spacing: .2em; margin-top: .4em; animation: fadeUp .5s both; animation-delay: .3s; }
</style></head><body><div id="wrap"><div class="c"><div class="in"><div class="num"></div><div class="lbl"></div></div></div></div>
<script src="_base.js"></script><script>
// params: from, to, decimals, prefix, suffix, label, count_time (сек), y, size, accent
const fmt = v => (P.prefix || '') + v.toLocaleString('ru-RU', { minimumFractionDigits: P.decimals || 0,
  maximumFractionDigits: P.decimals || 0 }) + (P.suffix || '');
window.setup = () => {
  css('--y', ((P.y ?? 0.45) * H) + 'px'); css('--size', ((P.size || (VERT ? 0.2 : 0.12)) * W) + 'px');
  const l = document.querySelector('.lbl'); if (P.label) l.textContent = P.label; else l.remove();
  // подгоняем кегль под самое длинное значение, чтобы число не вылезало за кадр
  const num = document.querySelector('.num'), c = document.querySelector('.in');
  num.textContent = fmt(Math.max(Math.abs(P.from ?? 0), Math.abs(P.to ?? 100)) * (P.to < 0 ? -1 : 1));
  const fit = W * 0.9 / Math.max(c.offsetWidth, 1);
  if (fit < 1) css('--size', ((P.size || (VERT ? 0.2 : 0.12)) * W * fit) + 'px');
  window.seek(0);
};
window.seek = t => {
  const a = P.from ?? 0, b = P.to ?? 100, T = P.count_time ?? Math.min(1.8, (P.duration || 3) * 0.6);
  document.querySelector('.num').textContent = fmt(a + (b - a) * ease.outExpo(Math.min(Math.max(t - 0.15, 0) / T, 1)));
};
</script></body></html>
