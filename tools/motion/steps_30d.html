       font-weight: 900; font-size: calc(var(--u) * 5.4); color: #fff; text-transform: uppercase; letter-spacing: .01em;

<script src="_base.js"></script><script>

// подогнать текст по ширине

// ───────── человечек ─────────

function figure(parent, o) {

  css('--u', U + 'px');

  });
