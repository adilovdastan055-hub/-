#cap span.cur { color: #fff; }
#cap span.cur::after { content: ''; position: absolute; left: 0; right: 0; bottom: -.12em; height: .12em; border-radius: .1em; background: #FF7A2F; }

};

const clamp = x => Math.max(0, Math.min(1, x));
window.seek = t => {
  // сцены: появление 0.3 с, уход 0.2 с
  S.forEach(({ el, a, b }) => {
    const k = clamp((t - a) / .3) * (1 - clamp((t - (b - .2)) / .2));
    el.style.opacity = k; el.style.transform = `translateY(${(1 - clamp((t - a) / .3)) * 3}%) scale(${1 - (1 - clamp((t - (b - .2)) / .2)) * 0 + (clamp((t - (b - .2)) / .2)) * -.04})`;
    el.style.visibility = k > 0 ? 'visible' : 'hidden';
  });
  CNT.forEach(c => {
    const k = clamp((t - c.a) / (c.b - c.a)), e = ease.outCubic(k);
    if (c.text != null) { const n = Math.round(c.text.length * k); c.el.innerHTML = c.text.slice(0, n) + `<span style="opacity:${Math.floor(t * 3) % 2 ? 1 : .2};color:#3EE6B0">|</span>`; }
    else if (c.hl) { const on = t >= c.a && t < c.b; c.el.style.borderColor = on ? '#3EE6B0' : 'rgba(255,255,255,.14)';
      c.el.style.boxShadow = on ? '0 0 30px rgba(62,230,176,.45)' : '0 20px 50px rgba(0,0,0,.35)'; c.el.style.opacity = t < c.a ? '' : (on ? 1 : .55); if (t >= c.a) c.el.style.transform = on ? 'scale(1.06)' : 'scale(.96)'; }
    else if (c.merge) { const d = (1 - ease.outCubic(k)) * U * 16; c.merge[0].style.transform = `translateX(${-d}px)`; c.merge[1].style.transform = `translateX(${d}px) scale(${1 + k * .15})`; }
    else if (c.dot) { const kk = clamp((t - c.a) / 1.3); c.dot.style.offsetDistance = (ease.outCubic(kk) * 100 + Math.max(0, t - c.a - 1.3) * 40) % 100 + '%'; c.dot.style.opacity = t > c.a ? 1 : 0; }
    else if (c.rings) { c.rings.forEach((r, i) => { let p = ((t - c.a) * .55 + i / c.rings.length) % 1; if (t < c.a) p = i / c.rings.length;
        const s = c.out ? .15 + p * 1.6 : 1.75 - p * 1.6; r.style.transform = `scale(${s})`; r.style.opacity = (c.out ? 1 - p : p) * .9; }); }
    else if (c.fmt) { const v = c.from + (c.to - c.from) * e; if (c.html) c.el.innerHTML = c.fmt(v); else c.el.textContent = c.fmt(v); }
  });
  // субтитры
  const cap = document.getElementById('cap');
  let gi = -1;
  GROUPS.forEach((g, i) => { if (t >= WORDS[g[0]].s - .05) gi = i; });
  if (gi < 0) { cap.style.opacity = 0; return; }
  const g = GROUPS[gi], last = WORDS[g[g.length - 1]];
  const nextStart = GROUPS[gi + 1] ? WORDS[GROUPS[gi + 1][0]].s : 1e9;
  cap.style.opacity = (t > last.e + .6 && t < nextStart - .05) ? 0 : 1;
  cap.innerHTML = g.map(i => { const w = WORDS[i]; const cls = t >= w.s && t < w.e + .08 ? 'cur' : (t >= w.s ? 'on' : '');
    return `<span class="${cls}">${w.w.replace(/[.,]$/, '')}</span>`; }).join('');
};
</script></body></html>
