<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.draw { fill: none; stroke: var(--accent); stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw .55s cubic-bezier(.6,0,.2,1) forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.label { position: absolute; font-family: var(--font); font-weight: 800; font-size: calc(var(--u) * 4.6); color: #111;
         background: var(--accent); padding: .3em .65em; border-radius: .4em; white-space: nowrap;
         transform: translate(-50%, -50%); animation: lblIn .45s cubic-bezier(.2,.9,.3,1.3) both; animation-delay: .5s; }
@keyframes lblIn { from { transform: translate(-50%, -50%) scale(0); } to { transform: translate(-50%, -50%) scale(1); } }
</style></head><body><div id="wrap"><svg id="s"></svg></div><script src="_base.js"></script><script>
// params: x, y (центр цели, доли), r (радиус, доля меньшей стороны), label, lx, ly (позиция подписи, доли), accent
window.setup = () => {
  css('--u', U + 'px');
  const x = (P.x ?? .5) * W, y = (P.y ?? .5) * H, r = (P.r ?? .12) * Math.min(W, H);
  const px = P.x ?? .5, py = P.y ?? .5;
  const lx = (P.lx ?? (px > .5 ? Math.max(px - .3, .22) : Math.min(px + .3, .78))) * W;
  const ly = (P.ly ?? (py > .35 ? py - .22 : py + .22)) * H;
  const sw = U * 1.1, s = document.getElementById('s');
  const ang = Math.atan2(ly - y, lx - x), ex = x + Math.cos(ang) * (r + sw * 2), ey = y + Math.sin(ang) * (r + sw * 2);
  const sx = lx - Math.cos(ang) * U * 7, sy = ly - Math.sin(ang) * U * 5;
  const head = U * 3.2, a1 = ang + 0.5, a2 = ang - 0.5;
  s.innerHTML = `
    <ellipse class="draw" pathLength="1" cx="${x}" cy="${y}" rx="${r * 1.08}" ry="${r * .92}" stroke-width="${sw}"
      transform="rotate(-8 ${x} ${y})"/>
    <path class="draw" pathLength="1" style="animation-delay:.35s" stroke-width="${sw * .8}"
      d="M${sx},${sy} Q${(sx + ex) / 2 + 30},${(sy + ey) / 2 - 30} ${ex},${ey}"/>
    <path class="draw" pathLength="1" style="animation-delay:.75s;animation-duration:.2s" stroke-width="${sw * .8}"
      d="M${ex + Math.cos(a1) * head},${ey + Math.sin(a1) * head} L${ex},${ey} L${ex + Math.cos(a2) * head},${ey + Math.sin(a2) * head}"/>`;
  if (P.label) { const l = el('div', 'label', null, P.label); l.style.left = lx + 'px'; l.style.top = ly + 'px'; }
};
</script></body></html>
