<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
/* Компактная инфо-карточка сверху в стиле тёмного UI: номер пункта, заголовок, чипы-факты по таймингу речи */
.card { position: absolute; left: 50%; top: var(--top); width: var(--cw); transform: translateX(-50%);
        background: rgba(20,22,28,.86); border: 1px solid rgba(255,255,255,.09); border-radius: calc(var(--u) * 3);
        padding: calc(var(--u) * 2.6) calc(var(--u) * 3.2) calc(var(--u) * 2.8);
        box-shadow: 0 calc(var(--u) * 1.5) calc(var(--u) * 5) rgba(0,0,0,.35);
        font-family: 'Montserrat'; color: #fff; animation: cardIn .55s cubic-bezier(.16,1,.3,1) both; }
@keyframes cardIn { from { opacity: 0; transform: translate(-50%, -30%) scale(.96); filter: blur(8px); } to { opacity: 1; transform: translateX(-50%); filter: none; } }
.head { display: flex; align-items: center; gap: calc(var(--u) * 1.4); font-size: calc(var(--u) * 2.5); font-weight: 600;
        color: rgba(255,255,255,.55); letter-spacing: .02em; }
.star { width: calc(var(--u) * 3.2); height: calc(var(--u) * 3.2); color: var(--star); flex: none; animation: spin 1s cubic-bezier(.16,1,.3,1) both; }
@keyframes spin { from { transform: rotate(-120deg) scale(0); } to { transform: none; } }
.head .num { color: #fff; font-weight: 700; }
.dots { margin-left: auto; display: flex; gap: calc(var(--u) * .8); }
.dot { width: calc(var(--u) * 4); height: calc(var(--u) * .7); border-radius: 9px; background: rgba(255,255,255,.18); overflow: hidden; }
.dot i { display: block; height: 100%; background: var(--accent); transform-origin: left; }
.dot.on i { animation: fill .6s cubic-bezier(.7,0,.2,1) .25s both; }
.dot.done i { transform: none; }
.dot:not(.on):not(.done) i { transform: scaleX(0); }
@keyframes fill { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.title { font-size: calc(var(--u) * 4.6); font-weight: 700; letter-spacing: -.03em; line-height: 1.1;
         margin: calc(var(--u) * 1.3) 0 calc(var(--u) * 1.6); animation: soft .5s cubic-bezier(.2,.8,.2,1) .15s both; }
.items { display: flex; flex-wrap: wrap; gap: calc(var(--u) * 1.2); }
.it { display: flex; align-items: center; gap: .45em; font-size: calc(var(--u) * 2.9); font-weight: 600;
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.08); border-radius: calc(var(--u) * 1.6);
      padding: .42em .7em .42em .55em; animation: chip .45s cubic-bezier(.2,.9,.3,1.25) both; }
.it .ic { font-size: 1.1em; line-height: 1; }
.it .ck { color: var(--accent); font-weight: 800; font-size: .9em; }
@keyframes chip { from { opacity: 0; transform: translateY(40%) scale(.85); } to { opacity: 1; transform: none; } }
@keyframes soft { from { opacity: 0; transform: translateY(30%); filter: blur(5px); } to { opacity: 1; transform: none; filter: none; } }
</style></head><body><div id="wrap"><div class="card">
<div class="head"><svg class="star" viewBox="0 0 24 24"><g stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
<path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9L4.9 19.1"/></g></svg>
<span><span class="num"></span> <span class="lbl"></span></span><div class="dots"></div></div>
<div class="title"></div><div class="items"></div></div></div>
<script src="_base.js"></script><script>
// params: num ("01"), label, step (1..total), total, title, items [{icon,label,at}], top (доля H), width (доля W), accent, star
window.setup = () => {
  css('--u', U + 'px'); css('--top', ((P.top ?? 0.06) * H) + 'px'); css('--cw', ((P.width ?? 0.8) * W) + 'px');
  css('--accent', P.accent || '#4AA8FF'); css('--star', P.star || '#E8774F');
  document.querySelector('.num').textContent = P.num || '';
  document.querySelector('.lbl').textContent = P.label || '';
  document.querySelector('.title').textContent = P.title || '';
  const dots = document.querySelector('.dots'); const total = P.total || 3, step = P.step || 1;
  for (let i = 1; i <= total; i++) { const d = el('div', 'dot' + (i < step ? ' done' : i === step ? ' on' : ''), dots); el('i', '', d); }
  const items = document.querySelector('.items');
  (P.items || []).forEach(o => {
    const it = el('div', 'it', items); it.style.animationDelay = (o.at || 0) + 's';
    el('span', 'ck', it, '✓'); if (o.icon) el('span', 'ic', it, o.icon); el('span', '', it, o.label);
  });
};
</script></body></html>
