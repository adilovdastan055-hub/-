<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_base.css"><style>
/* HUD в стиле «N трюков»: шаги 1—2—3, огромная лаймовая цифра, подпись, круглый бейдж, тёмная шапка */
:root { --accent: #C8FF1E; }
.shade { position: absolute; left: 0; right: 0; top: 0; height: 42%;
         background: linear-gradient(to bottom, rgba(6,8,4,.78), rgba(6,8,4,.45) 55%, rgba(6,8,4,0));
         animation: fade .35s both; }
@keyframes fade { from { opacity: 0; } }
.steps { position: absolute; left: 50%; top: calc(var(--y) - var(--u) * 13); transform: translateX(-50%);
         display: flex; align-items: center; }
.dot { width: calc(var(--u) * 7.6); height: calc(var(--u) * 7.6); border-radius: 50%; display: flex; align-items: center;
       justify-content: center; font: 800 calc(var(--u) * 4.4) 'Montserrat'; color: var(--accent);
       background: rgba(20,24,14,.85); border: calc(var(--u) * .45) solid rgba(200,255,30,.35);
       animation: popIn .45s cubic-bezier(.2,.9,.3,1.3) both; }
.dot.on { background: var(--accent); color: #0b0d06; border-color: var(--accent);
          box-shadow: 0 0 calc(var(--u) * 4) rgba(200,255,30,.55); }
.dot.on span { display: inline-block; animation: pulse 1s ease-in-out .5s infinite; }
@keyframes pulse { 50% { transform: scale(1.18); } }
.ln { width: calc(var(--u) * 6); height: calc(var(--u) * .5); background: rgba(200,255,30,.45); transform-origin: left;
      animation: grow .35s ease-out both; }
@keyframes grow { from { transform: scaleX(0); } }
.row { position: absolute; left: calc(var(--u) * 7); right: calc(var(--u) * 7); top: var(--y);
       display: flex; align-items: center; gap: calc(var(--u) * 3); }
.num { font: 900 var(--nsize) 'Montserrat'; line-height: .8; letter-spacing: -.04em;
       background: linear-gradient(170deg, #F4FF8A 0%, var(--accent) 40%, #4E7A00 100%);
       -webkit-background-clip: text; background-clip: text; color: transparent;
       filter: drop-shadow(0 .03em .06em rgba(0,0,0,.55));
       animation: numIn .6s cubic-bezier(.2,.9,.25,1.2) both; }
@keyframes numIn { from { transform: scale(2.2) rotate(-12deg); opacity: 0; filter: blur(12px); } }
.txt { flex: 1; display: flex; flex-direction: column; gap: calc(var(--u) * 1.2); min-width: 0; }
.kick, .tail { white-space: nowrap; font: 600 calc(var(--u) * 4.8) 'Montserrat'; color: #fff; opacity: .92;
               text-shadow: 0 .05em .2em rgba(0,0,0,.6); animation: slide .5s cubic-bezier(.2,.8,.2,1) both; }
.head { font: 900 var(--hsize) 'Montserrat'; color: #fff; line-height: 1.02; white-space: nowrap;
        text-shadow: 0 .05em .2em rgba(0,0,0,.6); animation: slide .55s cubic-bezier(.2,.8,.2,1) both; }
.head .a { color: var(--accent); }
@keyframes slide { from { transform: translateX(-30%); opacity: 0; filter: blur(8px); } }
.badge { width: calc(var(--u) * 17); height: calc(var(--u) * 17); border-radius: 50%; background: var(--accent); flex: none;
         display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * .4);
         box-shadow: 0 0 calc(var(--u) * 6) rgba(200,255,30,.45);
         animation: popIn .5s cubic-bezier(.2,.9,.3,1.4) both, wob 2.4s ease-in-out .8s infinite; }
@keyframes wob { 50% { transform: rotate(-8deg) scale(1.05); } }
.badge b { font: 700 calc(var(--u) * 2.9) 'Montserrat'; color: #0b0d06; }
.badge i { font-style: normal; font-size: calc(var(--u) * 7); line-height: 1; }
.arc { position: absolute; left: calc(var(--u) * -10); top: calc(var(--u) * -6); width: calc(var(--u) * 50);
       height: calc(var(--u) * 50); border-radius: 50%; border: calc(var(--u) * 2.2) solid var(--accent);
       border-color: var(--accent) transparent transparent transparent; transform: rotate(-30deg);
       filter: drop-shadow(0 0 calc(var(--u) * 2) rgba(200,255,30,.7)); animation: arc .8s cubic-bezier(.2,.8,.2,1) both; }
@keyframes arc { from { transform: rotate(-120deg); opacity: 0; } }
</style></head><body><div id="wrap"><div class="shade"></div></div><script src="_base.js"></script><script>
// params: num, kicker, head (*слово* — лайм), tail, badge {icon,label}, steps (кол-во), active, y (доля высоты),
//         count {to, suffix} — счётчик внутри head вместо {N}, arc (декор-дуга)
const fmt = v => Math.round(v).toLocaleString('ru-RU');
window.setup = () => {
  css('--u', U + 'px'); css('--y', ((P.y ?? 0.2) * H) + 'px');
  css('--nsize', (P.nsize ?? 0.3) * W + 'px'); css('--hsize', (P.hsize ?? 0.085) * W + 'px');
  const wrap = document.getElementById('wrap');
  if (P.arc) el('div', 'arc', wrap);
  if (P.steps) {
    const s = el('div', 'steps', wrap);
    for (let i = 1; i <= P.steps; i++) {
      if (i > 1) { const l = el('div', 'ln', s); l.style.animationDelay = (i * .08) + 's'; }
      const d = el('div', 'dot' + (i === P.active ? ' on' : ''), s); el('span', '', d, String(i));
      d.style.animationDelay = (i * .08) + 's';
    }
  }
  const row = el('div', 'row', wrap);
  if (P.num != null) el('div', 'num', row, String(P.num));
  const t = el('div', 'txt', row);
  if (P.kicker) { const k = el('div', 'kick', t, P.kicker); k.style.animationDelay = '.15s'; }
  if (P.head) {
    const h = el('div', 'head', t); h.style.animationDelay = '.25s';
    P.head.split('*').forEach((part, i) => {
      if (!part) return;
      const sp = el('span', i % 2 ? 'a' : '', h);
      if (part.includes('{N}')) { sp.innerHTML = part.replace('{N}', '<span class="cnt"></span>'); }
      else sp.textContent = part;
    });
  }
  if (P.tail) { const k = el('div', 'tail', t, P.tail); k.style.animationDelay = '.4s'; }
  if (P.badge) {
    const b = el('div', 'badge', row); b.style.animationDelay = '.35s, 1s';
    el('i', '', b, P.badge.icon || '✨'); if (P.badge.label) el('b', '', b, P.badge.label);
  }
  // кегль заголовка — чтобы всё влезло в строку
  const head = document.querySelector('.head');
  if (head) {
    const c = document.querySelector('.cnt'); if (c) c.textContent = fmt(P.count.to) + (P.count.suffix || '');
    const avail = t.clientWidth, need = head.scrollWidth;
    if (need > avail) css('--hsize', (P.hsize ?? 0.085) * W * avail / need * .98 + 'px');
  }
  window.seek(0);
};
window.seek = tt => {
  const c = document.querySelector('.cnt'); if (!c) return;
  const k = ease.outExpo(Math.min(Math.max(tt - (P.count.delay ?? .3), 0) / (P.count.time ?? 1.2), 1));
  c.textContent = fmt((P.count.from ?? 0) + (P.count.to - (P.count.from ?? 0)) * k) + (P.count.suffix || '');
};
</script></body></html>
